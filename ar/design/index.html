<style>
/* Design portfolio — the home page's world; the work is the colour */
:root{
  color-scheme:dark;
  --bg:#070707; --card:#121110; --ink:#F3F1EE; --ink-2:#BDB8B1; --muted:#7D776F;
  --line:rgba(243,241,238,.09); --line-2:rgba(243,241,238,.16); --rim:#F0A45B;
  --latin:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --arabic:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --sans:var(--latin); --out:cubic-bezier(.16,1,.3,1); --ease:cubic-bezier(.2,.7,.1,1);
}
html[lang="ar"]{--sans:var(--arabic)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:clip}
html[lang="ar"] body{letter-spacing:0;line-height:1.85}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--rim);outline-offset:3px;border-radius:10px}
::selection{background:var(--rim);color:#000}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4vw,56px)}

@view-transition{navigation:auto}
::view-transition-old(root){animation:vtOut .32s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:vtIn .6s cubic-bezier(.16,1,.3,1) both}
@keyframes vtOut{to{opacity:0;transform:scale(.985)}}
@keyframes vtIn{from{opacity:0;transform:translateY(14px) scale(.995)}}

.top{display:flex;justify-content:space-between;align-items:center;padding-block:calc(env(safe-area-inset-top,0px) + 22px) 0;direction:ltr}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);background:rgba(255,255,255,.03);transition:background .3s,color .3s,box-shadow .3s}
.back svg{width:18px;height:18px;transition:transform .35s var(--out)}
.back:hover{background:var(--ink);color:#000;box-shadow:none}
.back:hover svg{transform:translateX(-3px)}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
html[dir="rtl"] .back:hover svg{transform:scaleX(-1) translateX(-3px)}
.lang{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line-2);font-size:13px;font-weight:500}
.lang a{padding:6px 13px;border-radius:999px;color:var(--muted)}
.lang a[aria-current="page"]{background:var(--ink);color:#000}
.lang .ar{font-family:var(--arabic)} .lang .en{font-family:var(--latin)}

/* hero */
.hero{padding-block:clamp(48px,8vw,96px) clamp(28px,4vw,44px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,44px);align-items:center}
.mark{width:clamp(84px,11vw,128px);aspect-ratio:1;display:block;overflow:visible}
.kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rim);margin:0 0 12px;display:flex;align-items:center;gap:10px}
html[lang="ar"] .kicker{font-family:var(--arabic);letter-spacing:0;font-size:14.5px}
.kicker::before{content:"";width:22px;height:1px;background:currentColor}
h1{margin:0;font-size:clamp(40px,6.4vw,84px);line-height:.98;letter-spacing:-.05em;font-weight:700}
html[lang="ar"] h1{letter-spacing:0;line-height:1.25}
.lede{margin:18px 0 0;color:var(--ink-2);font-size:clamp(17px,1.8vw,21px);line-height:1.5;max-width:48ch}
.hero > div > *{animation:slide .9s var(--out) both}
.hero > div > :nth-child(2){animation-delay:.1s}.hero > div > :nth-child(3){animation-delay:.2s}
:root{--from:-30px} html[dir="rtl"]{--from:30px}
@keyframes slide{from{opacity:0;transform:translate3d(var(--from),0,0)}to{opacity:1;transform:none}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;padding-block:8px}
.filters::before{content:"";position:absolute;inset:-6px -12px;background:linear-gradient(var(--bg) 60%,transparent);z-index:-1}
.filters button{all:unset;cursor:pointer;font-size:14px;font-weight:500;padding:9px 16px;border-radius:999px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .25s,color .25s}
.filters button[aria-pressed="true"]{background:var(--ink);color:#000;box-shadow:none}
.filters button:focus-visible{outline:2px solid var(--rim);outline-offset:2px}
.filters b{font-family:var(--mono);font-weight:400;font-size:11.5px;opacity:.6;margin-inline-start:6px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.4vw,18px);padding-bottom:clamp(48px,7vw,96px)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:block;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--card);isolation:isolate;
  transition:transform .6s var(--out),opacity .4s var(--ease)}
.tile:focus-visible{outline:2px solid var(--rim);outline-offset:3px}
.tile picture,.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile .on{opacity:0;transform:scale(1.04);transition:opacity .55s var(--ease),transform .9s var(--out)}
.tile .base{transition:transform .9s var(--out)}
.tile .cap{position:absolute;inset:auto 0 0 0;padding:44px 16px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;z-index:2;
  background:linear-gradient(transparent,rgba(0,0,0,.72));opacity:0;transform:translateY(8px);transition:opacity .4s var(--ease),transform .5s var(--out)}
.tile .cap b{font-size:16px;font-weight:600;letter-spacing:-.01em;color:#fff;line-height:1.3}
html[lang="ar"] .tile .cap b{letter-spacing:0}
.tile .cap span{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}
html[lang="ar"] .tile .cap span{font-family:var(--arabic);font-size:12px;letter-spacing:0;text-transform:none}
@media (hover:hover){
  .tile:hover .on,.tile:focus-visible .on{opacity:1;transform:none}
  .tile:hover .base{transform:scale(1.03)}
  .tile:hover .cap,.tile:focus-visible .cap{opacity:1;transform:none}
}
@media (hover:none){ .tile .cap{opacity:1;transform:none} }
.tile.out{display:none}
.tile.enter{animation:tileIn .7s var(--out) both;animation-delay:calc(var(--n,0) * 45ms)}
@keyframes tileIn{from{opacity:0;transform:translateY(16px) scale(.98)}}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(5,5,5,.96);display:grid;grid-template-rows:auto minmax(0,1fr) auto;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.viewer.open{opacity:1;pointer-events:auto}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 16px) clamp(16px,3vw,32px) 8px}
.vtitle{min-width:0}
.vtitle b{display:block;font-size:clamp(17px,2vw,22px);font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="ar"] .vtitle b{letter-spacing:0}
.vtitle span{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
html[lang="ar"] .vtitle span{font-family:var(--arabic);font-size:13px;letter-spacing:0;text-transform:none}
.vbtn{all:unset;cursor:pointer;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .25s,color .25s}
.vbtn:hover{background:var(--ink);color:#000}
.vbtn svg{width:18px;height:18px}
.vbtn:focus-visible{outline:2px solid var(--rim);outline-offset:2px}
.stagev{position:relative;display:grid;place-items:center;min-height:0;padding:8px clamp(8px,6vw,96px);touch-action:pan-y}
.stagev img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8);object-fit:contain;transition:opacity .25s var(--ease),transform .45s var(--out)}
.stagev img.swap{opacity:0;transform:scale(.985)}
.nav{position:absolute;top:50%;transform:translateY(-50%)}
.nav.prev{left:clamp(8px,2vw,24px)} .nav.next{right:clamp(8px,2vw,24px)}
.vfoot{display:grid;gap:12px;padding:8px clamp(16px,3vw,32px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;justify-content:safe center;padding-block:4px;direction:ltr}
.strip::-webkit-scrollbar{display:none}
.strip button{all:unset;cursor:pointer;flex:none;width:58px;height:58px;border-radius:10px;overflow:hidden;opacity:.45;transition:opacity .25s,transform .3s var(--out);box-shadow:inset 0 0 0 1px var(--line-2)}
.strip button img{width:100%;height:100%;object-fit:cover;display:block}
.strip button[aria-current="true"]{opacity:1;transform:translateY(-2px);box-shadow:0 0 0 2px var(--ink)}
.strip button:focus-visible{outline:2px solid var(--rim);outline-offset:2px}
.vlinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vlinks a{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;font-weight:500;font-size:14.5px;background:var(--ink);color:#000;transition:transform .3s var(--out)}
.vlinks a.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.vlinks a:hover{transform:translateY(-2px)}
.vlinks svg{width:16px;height:16px}

footer{padding-block:24px 40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
footer a:hover{color:var(--ink)}

/* HD mark build */
.hd-c,.hd-p{transform-box:fill-box;transform-origin:center}
.hd-up{transform-origin:50% 100%}.hd-x{transform-origin:0 50%}.hd-dm{stroke-dasharray:760}
.play .hd-c{animation:pop .8s var(--out) both}
.play .hd-p1{animation:gy .6s .25s var(--out) both}.play .hd-p2{animation:gx .45s .55s var(--out) both}.play .hd-p3{animation:gy .6s .7s var(--out) both}
.play .hd-dm{animation:d760 1.1s .85s cubic-bezier(.65,0,.35,1) both}
@keyframes pop{from{transform:scale(.8);opacity:.001}to{transform:none;opacity:1}}
@keyframes gy{from{transform:scaleY(0)}to{transform:none}}
@keyframes gx{from{transform:scaleX(0)}to{transform:none}}
@keyframes d760{from{stroke-dashoffset:760}to{stroke-dashoffset:0}}

@media (max-width:860px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .nav{display:none}
  .stagev{padding-inline:12px}
  .tile .cap{padding:30px 10px 10px}
  .tile .cap b{font-size:13.5px}
  .tile .cap span{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
