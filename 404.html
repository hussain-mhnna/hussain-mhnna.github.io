<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Hussain Mhnna</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070707">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Geist+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#070707;--ink:#F3F1EE;--ink-2:#BDB8B1;--muted:#7D776F;--line-2:rgba(243,241,238,.16);--rim:#F0A45B;--ghost:#34302B;--out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Geist",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
main{position:relative;min-height:100%;display:grid;align-content:end;padding:clamp(24px,5vw,64px);padding-bottom:max(clamp(32px,8vh,96px),env(safe-area-inset-bottom))}
.ghost{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;user-select:none;
  font-weight:800;font-size:clamp(180px,42vw,560px);letter-spacing:-.07em;line-height:.8;color:var(--ghost)}
.ghost span{display:inline-block;animation:in 1.6s var(--out) both}
.ghost span:nth-child(1){animation-name:inL}.ghost span:nth-child(3){animation-name:inR}
@keyframes inL{from{transform:translateX(-40vw);opacity:0}}
@keyframes inR{from{transform:translateX(40vw);opacity:0}}
@keyframes in{from{opacity:0}}
.copy{position:relative;display:grid;gap:14px;animation:up 1s .5s var(--out) both}
@keyframes up{from{opacity:0;transform:translateX(-24px)}}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 12.5px/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--rim)}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor}
h1{margin:0;font-size:clamp(32px,4.4vw,56px);font-weight:600;letter-spacing:-.04em;line-height:1.05}
.ar{font-family:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;direction:rtl;text-align:left;unicode-bidi:plaintext;color:var(--ink-2);font-size:clamp(18px,2vw,22px);margin:0}
a{justify-self:start;margin-top:10px;display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:999px;background:var(--ink);color:#000;text-decoration:none;font-weight:600;font-size:15px;transition:transform .3s var(--out)}
a:hover{transform:translateY(-2px)}
a:focus-visible{outline:2px solid var(--rim);outline-offset:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="ghost" aria-hidden="true"><div><span>4</span><span>0</span><span>4</span></div></div>
  <div class="copy">
    <p class="eyebrow" style="margin:0">Page not found</p>
    <h1>This page doesn’t exist.</h1>
    <p class="ar" lang="ar">هذه الصفحة غير موجودة.</p>
    <a href="/">← Back home · العودة للرئيسية</a>
  </div>
</main>
</body>
</html>
